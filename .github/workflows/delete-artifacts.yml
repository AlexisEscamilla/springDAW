name: Delete All Artifacts

on:
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Necesario para eliminar artifacts
      contents: read
    
    steps:
      - name: Delete all artifacts using GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🔍 Buscando artifacts para eliminar...');
            
            // Obtener todos los artifacts del repositorio
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            console.log(`📦 Encontrados ${artifacts.data.artifacts.length} artifacts`);
            
            if (artifacts.data.artifacts.length === 0) {
              console.log('✅ No hay artifacts para eliminar');
              return;
            }
            
            // Eliminar cada artifact
            let deletedCount = 0;
            let errorCount = 0;
            
            for (const artifact of artifacts.data.artifacts) {
              try {
                console.log(`🗑️ Eliminando: ${artifact.name} (ID: ${artifact.id}, Tamaño: ${(artifact.size_in_bytes / 1024 / 1024).toFixed(2)} MB)`);
                
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                
                deletedCount++;
                console.log(`✅ Eliminado exitosamente: ${artifact.name}`);
                
              } catch (error) {
                errorCount++;
                console.log(`❌ Error eliminando ${artifact.name}: ${error.message}`);
              }
            }
            
            console.log(`\n📊 Resumen:`);
            console.log(`✅ Artifacts eliminados: ${deletedCount}`);
            console.log(`❌ Errores: ${errorCount}`);
            console.log(`📦 Total procesados: ${artifacts.data.artifacts.length}`);
            
            if (deletedCount > 0) {
              console.log('🎉 ¡Limpieza completada exitosamente!');
            }

      # Método alternativo con delete-artifact v5 (más reciente)
      - name: Fallback - Delete with v5 action
        uses: geekyeggo/delete-artifact@v5
        with:
          name: '*'
        if: failure() # Solo se ejecuta si el método anterior falla
