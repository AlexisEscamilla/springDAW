name: Delete Old Artifacts

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub
  schedule:
    # Ejecuta automáticamente cada día a las 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete ALL artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          # Usa '*' para borrar todos los artifacts
          name: '*'
          useGlob: true
          failOnError: false
      
      # Alternativa más moderna y robusta
      - name: Delete artifacts using actions/github-script (alternative)
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            
            // Obtener todos los artifacts del repositorio
            const allArtifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Borrar todos los artifacts
            for (const artifact of allArtifacts.data.artifacts) {
              console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`✅ Deleted: ${artifact.name}`);
              } catch (error) {
                console.log(`❌ Failed to delete ${artifact.name}: ${error.message}`);
              }
            }
        # Descomenta esta línea si el primer método no funciona
        if: false
