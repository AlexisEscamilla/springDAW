<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Chats - Rolas</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img class="imagi" src="/images/logo.png" alt="rolas" />
        <a href="/index">Rolas</a>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="/home">Home</a>
        <a class="nav-link" href="/explorar">Explorar</a>
        <a class="nav-link" href="/notificaciones">Notificaciones</a>
        <a class="nav-link active" href="/chats">Chats</a>
        <a class="nav-link" href="/colecciones">Canciones</a>
      </div>
      <div class="user-menu">
        <a class="nav-link" href="/logout">Cerrar Sesión</a>
      </div>
    </div>

    <div class="container" style="display: flex; height: 85vh">
      <!-- Lista de contactos -->
      <div
        class="contact-list"
        style="width: 30%; border-right: 1px solid #ccc; overflow-y: auto"
      >
        <h2 style="padding: 10px">Tus chats</h2>
        <div
          th:each="contacto : ${contactos}"
          class="trending-cardLista"
          th:onclick="'loadChat(' + ${contacto.id} + ')'"
          style="cursor: pointer"
        >
          <div class="profile-songlist">
            <img
              th:src="@{${contacto.profilePicture}}"
              class="avatar-imgcreatorlist"
              alt="avatar"
            />
          </div>
          <div class="trending-content">
            <div class="trending-title" th:text="${contacto.nombre}">
              Nombre del usuario
            </div>
            <div class="trending-meta">Haz clic para chatear</div>
          </div>
        </div>
      </div>

      <!-- Panel de conversación -->
      <div
        class="chat-panel"
        style="width: 70%; display: flex; flex-direction: column"
      >
        <div
          class="chat-header"
          style="padding: 15px; border-bottom: 1px solid #ccc"
        >
          <h2 id="chatUser">Selecciona un usuario</h2>
        </div>

        <div
          class="chat-messages"
          id="chatMessages"
          style="flex: 1; padding: 15px; overflow-y: auto"
        >
          <!-- Mensajes se agregarán aquí dinámicamente -->
        </div>

        <div
          class="chat-input"
          style="padding: 10px; border-top: 1px solid #ccc"
        >
          <form id="messageForm" onsubmit="sendMessage(event)">
            <input
              type="text"
              id="messageText"
              placeholder="Escribe tu mensaje..."
              class="form-input"
              style="width: 85%"
              required
            />
            <button type="submit" class="btn btn-primary" style="width: 13%">
              Enviar
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      function loadChat(userId) {
        // Aquí podrías hacer una petición AJAX para cargar los mensajes del usuario seleccionado
        document.getElementById("chatUser").textContent =
          "Chat con usuario ID: " + userId;
        document.getElementById("chatMessages").innerHTML = `
      <div class="message received">Hola, ¿cómo estás?</div>
      <div class="message sent">¡Bien! ¿Y tú?</div>
    `;
      }

      function sendMessage(event) {
        event.preventDefault();
        const message = document.getElementById("messageText").value.trim();
        if (message === "") return;

        const msgContainer = document.getElementById("chatMessages");
        const newMsg = document.createElement("div");
        newMsg.className = "message sent";
        newMsg.textContent = message;
        msgContainer.appendChild(newMsg);

        document.getElementById("messageText").value = "";
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }
    </script>

    <style>
      .message {
        margin: 8px 0;
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 70%;
        word-wrap: break-word;
      }
      .message.sent {
        background-color: #d1f0ff;
        align-self: flex-end;
        margin-left: auto;
      }
      .message.received {
        background-color: #eee;
        align-self: flex-start;
        margin-right: auto;
      }
    </style>
  </body>
</html>
