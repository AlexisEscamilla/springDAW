<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/stylesLogin.css" />
  </head>
  <body>
    <!-- Musical Particles -->
    <div class="music-particles" id="particles"></div>

    <!-- Animated Background Gradients -->
    <div class="bg-gradient bg-gradient-1"></div>
    <div class="bg-gradient bg-gradient-2"></div>
    <div class="bg-gradient bg-gradient-3"></div>
    <div class="container">
      <header>
        <div class="logo">
          <img
            class="imagi"
            src="https://images.vexels.com/media/users/3/150846/isolated/preview/a77bce5e752802277f78088150b16923-musica-de-icono-de-auriculares-de-audio.png"
            alt="rolas"
          />
          <div class="logo-icon"></div>
          <a href="/index">Rolas</a>
        </div>
      </header>
      <div class="form-container">
        <h1>Iniciar Sesión</h1>
        <div class="message-area" id="messageArea"></div>

        <form action="/login" method="post">
          <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div class="form-group">
            <button type="submit" class="btn">Iniciar Sesión</button>
          </div>
        </form>

        <div class="links">
          <p>¿No tienes una cuenta? <a href="/register">Regístrate</a></p>
        </div>
      </div>
    </div>

    <script>
      // Create floating musical particles
      function createParticles() {
        const particles = document.getElementById("particles");
        const musicSymbols = ["♪", "♫", "♩", "♬", "🎵", "🎶", "🎼"];

        function addParticle() {
          const particle = document.createElement("div");
          particle.className = "particle";
          particle.textContent =
            musicSymbols[Math.floor(Math.random() * musicSymbols.length)];
          particle.style.left = Math.random() * 100 + "%";
          particle.style.animationDuration = Math.random() * 8 + 8 + "s";
          particle.style.animationDelay = Math.random() * 2 + "s";
          particles.appendChild(particle);

          setTimeout(() => {
            particle.remove();
          }, 12000);
        }

        setInterval(addParticle, 1000);
      }

      // Initialize all effects
      document.addEventListener("DOMContentLoaded", function () {
        createParticles();
      });
    </script>
  </body>
</html>
