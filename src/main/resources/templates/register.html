<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="/css/stylesregister.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img class = "imagi" src="https://images.vexels.com/media/users/3/150846/isolated/preview/a77bce5e752802277f78088150b16923-musica-de-icono-de-auriculares-de-audio.png" alt="rolas">
                <div class="logo-icon"></div>
                <a href="/index">Rolas</a>
            </div>
        </header>

        <div class="form-container">
            <h1>Registro de Usuario</h1>
            <div class="message-area" id="messageArea">
                <div th:if="${message}" class="success-message" th:text="${message}"></div>
            </div>
            
            <form id="registerForm" th:action="@{/register}" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="userType">Tipo de usuario</label>
                    <select id="userType" name="userType" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="Artista">Artista</option>
                        <option value="oyente">Oyente</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn">Registrarse</button>
                </div>
            </form>
            
            <div class="links">
                <p>¿Ya tienes una cuenta? <a href="/login">Iniciar sesión</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const nombre = document.getElementById('nombre').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const userType = document.getElementById('userType').value;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nombre, username, email, password, userType })
            });

            if (response.ok) {
                // Mostrar mensaje de éxito
                document.getElementById('messageArea').innerHTML = `<div class="success-message">Usuario registrado con éxito</div>`;
                // Redireccionar después de un tiempo
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                // Mostrar mensaje de error
                document.getElementById('messageArea').innerHTML = `<div class="error-message">Hubo un error al registrar el usuario</div>`;
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('messageArea').innerHTML = '<div class="error-message">Error al conectar con el servidor</div>';
        }
    });
    </script>
</body>
</html>
