<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolas</title>
    <link rel="stylesheet" href="/css/stylesSubirCancion.css">
</head>
<body>
    <div class="bg-gradient bg-gradient-1"></div>
    <div class="bg-gradient bg-gradient-2"></div>
    <div class="bg-gradient bg-gradient-3"></div>
    <!-- Cabecera -->
    <div class="header">
        <div class="logo">
            <img class = "imagi" src="https://images.vexels.com/media/users/3/150846/isolated/preview/a77bce5e752802277f78088150b16923-musica-de-icono-de-auriculares-de-audio.png" alt="rolas">
            <div class="logo-icon"></div>
            <a href="/feed" class="tituloLogo">Rolas</a>
        </div>
        
        <div class="nav-links">
            <a class="nav-link tituloNAV" href="/feed">Home</a>
            <a class="nav-link tituloNAV" href="/explorar">Explorar</a>
            <a class="nav-link tituloNAV" href="/mostrarNotificaciones">Notificaciones</a>
            <a class="nav-link tituloNAV" href="/chats">Chats</a>
            <a class="nav-link tituloNAV" href="/colecciones">Colecciones</a>
        </div>
        
        <div class="user-menu">
            <!-- Botón que abre el modal -->
         <button type="button" class="btn btn-primary" onclick="abrirModal()">
           Cerrar Sesión
         </button>
       </div>
    </div>
    
    <div id="modalLogout" class="modal" style="display: none">
        <div class="modal-content">
          <p>¿Estás seguro de que deseas cerrar sesión?</p>
          <div class="modal-buttons">
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="btn btn-danger">Sí, salir</button>
            </form>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="cerrarModal()"
            >
              Cancelar
            </button>
          </div>
        </div>
      </div>
    <div class="container">


    <div class="container">
        <form class="edit-profile-form" th:action="@{/subirCancion}" method="post" enctype="multipart/form-data">
            <div class="form-title">Subir Canción</div>
        
            <!-- Imagen del cover -->
            <div class="profile-avatar-container">
                <label for="coverInput" class="profile-avatar" style="cursor: pointer; position: relative;">
                    <img id="coverPreview" class="avatar-img" src="/img/placeholder_cover.jpg" alt="Portada de la canción">
                    <div class="change-avatar"
                        style="opacity: 0; position: absolute; bottom: 0; left: 0; right: 0;
                                background-color: rgba(0,0,0,0.6); color: white;
                                text-align: center; padding: 5px 0; transition: opacity 0.3s;">
                        Cambiar Portada
                    </div>
                </label>
                <input type="file" id="coverInput" name="cover" accept="image/*" style="display: none;">
            </div>
        
            <!-- Archivo de la canción -->
            <div class="form-group">
                <label class="form-label" for="songFile">Archivo de la Canción (MP3)</label>
                <input type="file" id="songFile" name="audio" accept="audio/*" class="form-input" required>
            </div>
        
            <div class="form-section">
                <div class="form-section-title">Información de la Canción</div>
        
                <div class="form-group">
                    <label class="form-label" for="title">Título</label>
                    <input type="text" id="title" name="title" class="form-input" required>
                </div>
        
                <div class="form-group">
                    <label class="form-label" for="duration">Duración</label>
                    <input type="text" id="duration" name="duration" placeholder="Ej. 3:45" class="form-input" required>
                </div>
        
                <div class="form-group">
                    <label class="form-label" for="genero">Género</label>
                    <select name="genero" id="genero" class="form-input" required>
                        <option value="" disabled selected>Selecciona un género</option>
                        <option>Pop</option>
                        <option>Rock</option>
                        <option>Hip-Hop</option>
                        <option>Reggaeton</option>
                        <option>Electrónica</option>
                        <option>Clásica</option>
                        <option>Indie</option>
                        <option>Otro</option>
                    </select>
                </div>
        
                <div class="form-group">
                    <label class="form-label" for="album">Álbum</label>
                    <select name="album" id="album" class="form-input" required>
                        <option value="" disabled selected>Selecciona un álbum</option>
                        <!-- Renderizar los álbumes del artista -->
                        <option th:each="album : ${albums}"
                                th:value="${album.id}"
                                th:text="${album.title}">
                        </option>
                    </select>
                </div>
        
                <div class="form-section">
                    <div class="form-section-title">Artistas</div>
                    
                    <!-- Buscador de artistas -->
                    <div class="form-group">
                        <label class="form-label" for="artistSearch">Buscar artistas</label>
                        <input type="text" id="artistSearch" class="form-input" placeholder="Buscar por nombre de usuario">
                        <div id="artistSearchResults" class="search-results"></div>
                    </div>
                
                    <!-- Listado de artistas seleccionados -->
                    <div class="form-section">
                        <div class="form-section-title">Artistas Seleccionados</div>
                        <ul id="selectedArtists" class="selected-songs"></ul>
                    </div>
                
                    <!-- Campo oculto para enviar los usernames de los artistas -->
                    <input type="hidden" name="artists" id="artistIds">
                </div>
        
            </div>
        
            <div class="profile-controls">
                <a href="/colecciones" class="btn btn-secondary">Cancelar</a>
                <button class="btn btn-primary" type="submit">Subir Canción</button>
            </div>
        </form>
        
        <script>

const artistSearchInput = document.getElementById('artistSearch');
const artistSearchResults = document.getElementById('artistSearchResults');
const selectedArtists = document.getElementById('selectedArtists');
const selectedArtistIds = new Set(); // Para evitar duplicados
const artistIdsInput = document.getElementById('artistIds');

// Buscar artistas en tiempo real
artistSearchInput.addEventListener('input', function() {
    const query = this.value.trim();
    if (query.length > 0) {
        fetch(`/api/buscarUsuarios?query=${query}`)
            .then(response => response.json())
            .then(data => {
                artistSearchResults.innerHTML = '';
                data.forEach(user => {
                    const resultItem = document.createElement('div');
                    resultItem.textContent = `${user.nombre} (@${user.username})`;
                    resultItem.dataset.username = user.username;
                    resultItem.addEventListener('click', () => addArtistToSong(user));
                    artistSearchResults.appendChild(resultItem);
                });
            })
            .catch(error => console.error('Error al buscar artistas:', error));
    } else {
        artistSearchResults.innerHTML = '';
    }
});

// Agregar artista al listado de seleccionados
function addArtistToSong(user) {
    if (selectedArtistIds.has(user.username)) return; // Evitar duplicados

    selectedArtistIds.add(user.username);
    updateArtistIdsInput();

    const listItem = document.createElement('li');
    listItem.textContent = `${user.nombre} (@${user.username})`;
    
    const removeButton = document.createElement('button');
    removeButton.textContent = 'Eliminar';
    removeButton.addEventListener('click', () => {
        selectedArtistIds.delete(user.username);
        updateArtistIdsInput();
        listItem.remove();
    });
    
    listItem.appendChild(removeButton);
    selectedArtists.appendChild(listItem);

    // Limpiar búsqueda
    artistSearchResults.innerHTML = '';
    artistSearchInput.value = '';
}

// Actualizar el campo oculto con los usernames
function updateArtistIdsInput() {
    artistIdsInput.value = Array.from(selectedArtistIds).join(',');
}

            // Mostrar el campo de más artistas si el usuario selecciona "Sí"
            const coverInput = document.getElementById('coverInput');
            const coverPreview = document.getElementById('coverPreview');

            coverInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        coverPreview.src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            });
            
            
            

            function abrirModal() {
                document.getElementById("modalLogout").style.display = "block";
            }

            function cerrarModal() {
            document.getElementById("modalLogout").style.display = "none";
                }
</script>
        
        
        
</body>
</html>
